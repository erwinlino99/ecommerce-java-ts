<div class="dashboard-header">
  <h1>DETALLE DEL PRODUCTO</h1>
</div>

<div class="pending-container" *ngIf="loading()">
  <div class="spinner-mini"></div>
  <p>Sincronizando con la unidad central...</p>
</div>

<div class="detail-panel" *ngIf="!loading() && item()">
  
  <div class="detail-header">
    <div class="title-group">
      <h2>Producto: {{ form.get('name')?.value }}</h2>
      <span class="subtitle">REF: {{ item()?.id }}</span>
    </div>

    <div class="actions-group" style="display: flex; gap: 0.75rem; align-items: center;">
      
      <button *ngIf="!isEditing()" type="button" (click)="toggleEdit()" class="btn-industrial btn-edit">
        <mat-icon>edit</mat-icon>
        <span>EDITAR</span>
      </button>

      <ng-container *ngIf="isEditing()">
        <button type="button" (click)="toggleEdit()" class="btn-industrial btn-cancel">
          <mat-icon>close</mat-icon>
          <span>CANCELAR</span>
        </button>

        <button type="submit" form="productForm" [disabled]="form.invalid" class="btn-industrial btn-save">
          <mat-icon>save</mat-icon>
          <span>GUARDAR</span>
        </button>
      </ng-container>

      <button class="btn-industrial" 
              style="background-color: #991b1b; color: #fff; border: 1px solid #7f1d1d;"
              (click)="goBack()">
        <mat-icon>keyboard_return</mat-icon>
        <span>VOLVER</span>
      </button>
    </div>
  </div>

  <form [formGroup]="form" id="productForm" (ngSubmit)="save()" class="industrial-form">
    <div class="form-grid">
      
      <div class="form-field full-width">
        <label>Nombre del producto</label>
        <input type="text" formControlName="name" [readonly]="!isEditing()" 
               [style.font-size]="'1.2rem'" [style.color]="'var(--accent)'">
      </div>

      <app-base-selectable 
        label="Marca producto" 
        endpoint="shop-product-brand/selectable"
        formControlName="shopProductBrandId" 
        [readonly]="!isEditing()">
      </app-base-selectable>

      <div class="form-field">
        <label>Precio (EUR)</label>
        <input type="number" formControlName="price" [readonly]="!isEditing()" [style.font-weight]="'800'">
      </div>

      <div class="form-field">
        <label>Unidad de Medida</label>
        <input type="text" formControlName="measurementName" [readonly]="true" 
               style="background: rgba(0,0,0,0.1); border-style: dashed;">
      </div>

      <div class="form-field">
        <label>Unidades dentro del formato</label>
        <input type="text" formControlName="measurementUnit" [readonly]="true" 
               style="background: rgba(0,0,0,0.1); border-style: dashed;">
      </div>

      <div class="form-field">
        <label>Inventario Actual</label>
        <input type="number" formControlName="currentStock" [readonly]="!isEditing()"
               [style.color]="form.get('currentStock')?.value > 0 ? 'var(--success)' : 'var(--danger)'">
      </div>

      <div class="form-field">
        <label>Descripción corta</label>
        <input type="text" formControlName="shortDescription" [readonly]="!isEditing()">
      </div>

      <div class="form-field full-width">
        <label>Descripción completa</label>
        <textarea formControlName="description" [readonly]="!isEditing()"></textarea>
      </div>

    </div>
  </form>
</div>
