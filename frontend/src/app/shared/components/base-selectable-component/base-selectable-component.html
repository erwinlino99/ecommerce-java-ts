<div class="selectable-container">
  <label *ngIf="label" class="industrial-label">{{ label }}</label>
  
  <div class="select-wrapper">
    <select 
      [formControl]="internalControl" 
      [attr.disabled]="readonly ? true : null"
      (blur)="onTouched()"
      class="industrial-select">
      
      <option [value]="null" disabled selected>{{ placeholder }}</option>
      
      <option *ngFor="let item of items()" [value]="item.id">
        {{ item.name }}
      </option>
    </select>
    
    <div class="select-arrow">▼</div>
  </div>
</div>
